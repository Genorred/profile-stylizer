<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile stylizer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            items: [
              /* ваші записи */
            ],
          };
        },
      }).mount("#app"); // оживляє вміст <div id="app">
    </script>
    <div id="app">
      <header class="site-header">
        <!-- <h1>Profile stylizer</h1> -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
          <div class="container">
            <a class="navbar-brand" href="#">Мій застосунок</a>

            <button
              class="navbar-toggler"
              data-bs-toggle="collapse"
              data-bs-target="#menu"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
        </nav>
      </header>

      <main class="container">
        <section class="card">
          <h2>Вхід</h2>
          <div class="telegram-login">
            <button
              type="button"
              id="telegram-login-btn"
              class="btn btn-telegram"
            >
              Увійти через Telegram
            </button>
            <p id="telegram-login-status" class="status"></p>
          </div>

          <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required />

            <button type="submit" class="btn">Увійти</button>
            <p id="login-status" class="status"></p>
          </form>
        </section>

        <section class="card">
          <h2>Дані</h2>
          <button id="load-btn" class="btn">Завантажити</button>
          <p id="profile-status" class="status"></p>
          <div id="profile-card" class="profile-card hidden"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
