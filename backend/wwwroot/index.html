<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Profile stylizer</title>

    <!-- Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand" href="#">Мій застосунок</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Головна</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Профіль</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- MAIN GRID -->
      <main class="container my-4">
        <div class="row g-4">
          
          <!-- LOGIN COLUMN -->
          <div class="col-12 col-md-5">
            <div class="card shadow-sm">
              <div class="card-header">Вхід</div>

              <div class="card-body">
                <div class="mb-3">
                  <button class="btn btn-info text-white w-100">
                    Увійти через Telegram
                  </button>
                  <small class="text-muted d-block mt-2">
                    {{ telegramStatus }}
                  </small>
                </div>

                <hr />

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input v-model="email" type="email" class="form-control" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Пароль</label>
                  <input v-model="password" type="password" class="form-control" />
                </div>

                <button class="btn btn-primary w-100" @click="login">
                  Увійти
                </button>

                <small class="text-muted d-block mt-2">
                  {{ loginStatus }}
                </small>
              </div>
            </div>
          </div>

          <!-- DATA COLUMN -->
          <div class="col-12 col-md-7">
            <div class="card shadow-sm">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>Дані користувачів</span>
                <button class="btn btn-sm btn-outline-primary" @click="loadData">
                  Завантажити
                </button>
              </div>

              <div class="card-body">
                <div v-if="items.length === 0" class="text-muted">
                  Дані ще не завантажені
                </div>

                <ul v-else class="list-group list-group-flush">
                  <li
                    v-for="u in items"
                    :key="u.id"
                    class="list-group-item d-flex justify-content-between align-items-center"
                  >
                    <span>{{ u.name }}</span>
                    <span class="badge bg-success">{{ u.role }}</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Vue APP -->
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            email: "",
            password: "",

            loginStatus: "",
            telegramStatus: "Telegram не підключено",

            items: []
          };
        },

        methods: {
          login() {
            if (!this.email || !this.password) {
              this.loginStatus = "Заповніть всі поля";
              return;
            }

            this.loginStatus = `Вхід виконано як ${this.email}`;
          },

          loadData() {
            this.items = [
              { id: 1, name: "Олександр", role: "Admin" },
              { id: 2, name: "Марія", role: "User" },
              { id: 3, name: "Іван", role: "Moderator" }
            ];
          }
        }
      }).mount("#app");
    </script>
  </body>
</html>
