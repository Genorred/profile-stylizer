<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Profile stylizer</title>

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand" href="#">Мій застосунок</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Головна</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- MAIN -->
      <main class="container my-4">
        <div class="row g-4">
          
          <!-- LOGIN -->
          <div class="col-12 col-md-5">
            <div class="card shadow-sm">
              <div class="card-header">Вхід</div>

              <div class="card-body">
                
                <button class="btn btn-info text-white w-100 mb-3" @click="telegramLogin">
                  Увійти через Telegram
                </button>

                <small class="text-muted d-block mb-3">
                  {{ telegramStatus }}
                </small>

                <hr />

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input v-model="email" type="email" class="form-control" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Пароль</label>
                  <input v-model="password" type="password" class="form-control" />
                </div>

                <button class="btn btn-primary w-100" @click="login">
                  Увійти
                </button>

                <small class="text-muted d-block mt-2">
                  {{ loginStatus }}
                </small>
              </div>
            </div>
          </div>

          <!-- PROFILE -->
          <div class="col-12 col-md-7">
            <div class="card shadow-sm">
              
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>Профіль</span>
                <button class="btn btn-sm btn-outline-primary" @click="loadProfile">
                  Оновити
                </button>
              </div>

              <div class="card-body">

                <div v-if="loadingProfile" class="text-muted">
                  Завантаження...
                </div>

                <div v-else-if="!profile" class="text-muted">
                  Немає даних профілю
                </div>

                <div v-else class="row g-3">

                  <div class="col-12 col-md-6">
                    <div class="border rounded p-2">
                      <small>ID</small>
                      <div>{{ profile.id }}</div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="border rounded p-2">
                      <small>Ім'я</small>
                      <div>{{ profile.name }}</div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="border rounded p-2">
                      <small>Email</small>
                      <div>{{ profile.email }}</div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="border rounded p-2">
                      <small>Роль</small>
                      <div>{{ profile.role }}</div>
                    </div>
                  </div>

                  <div class="col-12">
                    <div class="border rounded p-2">
                      <small>Bio</small>
                      <div>{{ profile.bio || "—" }}</div>
                    </div>
                  </div>

                </div>

              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App -->
    <script src="app.js"></script>
  </body>
</html>
